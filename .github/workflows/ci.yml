name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install "ruff>=0.6"
      - name: Ruff check
        run: ruff check src tests scripts
      - name: Ruff format check
        run: ruff format --check src tests scripts

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/requirements-v2.txt ".[test]"
      - name: Run tests with coverage
        run: PYTHONPATH=src python -m pytest -q -p no:xdist
      - name: Independence audit
        run: PYTHONPATH=src python -m backtrader_mcp audit-independence

  typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mypy and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/requirements-v2.txt ".[test]" mypy
      - name: Mypy
        run: PYTHONPATH=src python -m mypy src/backtrader_mcp

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upgrade pip for clean-room acceptance
        run: |
          python -m pip install --upgrade pip
      - name: Run clean-wheel acceptance
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_acceptance.py --matrix all --require-no-skills --require-no-agent | tee backtrader-mcp-acceptance.json
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtrader-mcp-acceptance
          path: backtrader-mcp-acceptance.json
          if-no-files-found: warn
